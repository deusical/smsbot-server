openapi: 3.1.0
info:
  title: SmsBot control API
  version: 1.1.0
  description: Server commands, configuration, retained messages, owner-only attachments and control API.
    Fixture transport/provider are offline. Browser mutations require exact Origin;
    native clients use revocable bearer credentials. New optional capabilities are
    advertised by state.
servers:
- url: /api/v1
security:
- browserSession: []
- clientCredential: []
paths:
  /login:
    post:
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - token
              additionalProperties: false
              properties:
                token:
                  type: string
                  writeOnly: true
                remember:
                  type: boolean
                  description: Keep the session until sign-out or revoke-all instead of 12 hours; the cookie renews while in use.
      responses:
        '200':
          description: HttpOnly owner session established
        '401':
          description: Invalid credentials
  /logout:
    post:
      responses:
        '200':
          description: Session revoked
  /sessions/revoke:
    post:
      description: Owner only. Signs out every browser session, including the caller's.
      responses:
        '200':
          description: All browser sessions revoked
        '403':
          description: Client credentials cannot revoke sessions
  /state:
    get:
      responses:
        '200':
          description: Current process/transport/bot state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/State'
  /pause:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - paused
              additionalProperties: false
              properties:
                paused:
                  type: boolean
      responses:
        '200':
          description: Pause acknowledged, eligible queued requests cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/State'
  /conversations:
    get:
      responses:
        '200':
          description: First 25 inbox conversations or synthetic fixture set
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Conversation'
  /enrollment:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - conversation_id
              - participant_id
              additionalProperties: false
              properties:
                conversation_id:
                  type: string
                participant_id:
                  type: string
      responses:
        '200':
          description: Exact individual participant enrolled
        '400':
          description: Ineligible conversation or identity mismatch
  /enrollment/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    delete:
      responses:
        '200':
          description: Enrollment removed and queued work cancelled
  /activity:
    get:
      responses:
        '200':
          description: Latest 200 request metadata records, no message text
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Job'
  /conversations/{id}/messages:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    get:
      responses:
        '200':
          description: Latest retained messages, including explicitly imported historical
            text; descending by time
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    direction:
                      type: string
                      enum:
                      - incoming
                      - outgoing
                    at:
                      type: string
                    text:
                      type: string
        '403':
          description: Enrollment required
  /clients:
    get:
      security:
      - browserSession: []
      responses:
        '200':
          description: Revocable client IDs and labels
          never tokens: null
    post:
      security:
      - browserSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - label
              additionalProperties: false
              properties:
                label:
                  type: string
                  minLength: 1
                  maxLength: 80
      responses:
        '201':
          description: New ID
          label and token returned once; do not persist in browser storage: null
  /clients/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    delete:
      security:
      - browserSession: []
      responses:
        '200':
          description: Credential revoked
  /fixture/incoming:
    post:
      description: Exists only in fixture mode; no Google/carrier/provider requests.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                conversation_id:
                  type: string
                participant_id:
                  type: string
                text:
                  type: string
                at:
                  type: string
                  format: date-time
                historical:
                  type: boolean
                outgoing:
                  type: boolean
      responses:
        '200':
          description: Accepted boolean and fixture message ID
        '404':
          description: Unavailable in live mode
  /config:
    get:
      description: Encrypted server bot configuration
      responses:
        '200':
          description: Encrypted server bot configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Configuration'
        '400':
          description: Invalid bounded request
        '401':
          description: Authentication required
        '403':
          description: Access denied
        '409':
          description: State unavailable or expired
    put:
      description: Replace validated configuration; queued generation snapshots are
        unchanged
      responses:
        '200':
          description: Replace validated configuration; queued generation snapshots
            are unchanged
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Configuration'
        '400':
          description: Invalid bounded request
        '401':
          description: Authentication required
        '403':
          description: Access denied
        '409':
          description: State unavailable or expired
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Configuration'
  /models:
    get:
      description: Cached public model catalog; no implicit provider request
      responses:
        '200':
          description: Cached public model catalog; no implicit provider request
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Model'
        '400':
          description: Invalid bounded request
        '401':
          description: Authentication required
        '403':
          description: Access denied
        '409':
          description: State unavailable or expired
  /models/refresh:
    post:
      description: Explicit OpenRouter catalog refresh; unavailable in fixture mode
      responses:
        '200':
          description: Explicit OpenRouter catalog refresh; unavailable in fixture
            mode
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Model'
        '400':
          description: Invalid bounded request
        '401':
          description: Authentication required
        '403':
          description: Access denied
        '409':
          description: State unavailable or expired
  /models/refresh-compatible:
    post:
      description: Explicit authenticated refresh of the configured OpenAI-compatible catalog; unavailable in fixture mode
      responses:
        '200':
          description: Combined cached model catalog with the compatible provider refreshed
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Model'
        '401':
          description: Authentication required
        '403':
          description: Access denied
        '409':
          description: Fixture catalog is offline
        '502':
          description: Provider catalog request failed
  /provider-key:
    get:
      description: Owner-only configured flag; key never returned
      responses:
        '200':
          description: Owner-only configured flag; key never returned
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  configured: &id001
                    type: boolean
        '400':
          description: Invalid bounded request
        '401':
          description: Authentication required
        '403':
          description: Access denied
        '409':
          description: State unavailable or expired
      security:
      - browserSession: []
    put:
      description: Owner-only encrypted provider key replacement; empty clears it
      responses:
        '200':
          description: Owner-only encrypted provider key replacement; empty clears
            it
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  configured: *id001
        '400':
          description: Invalid bounded request
        '401':
          description: Authentication required
        '403':
          description: Access denied
        '409':
          description: State unavailable or expired
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                key:
                  type: string
                  maxLength: 4096
              required:
              - key
      security:
      - browserSession: []
  /compatible-provider:
    get:
      description: Owner-only compatible API endpoint and configured flag; key never returned
      responses:
        '200':
          description: Safe provider status; key never returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompatibleProviderStatus'
        '401':
          description: Authentication required
        '403':
          description: Owner required
      security:
      - browserSession: []
    put:
      description: Owner-only encrypted compatible API endpoint and optional key update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                base_url:
                  type: string
                  maxLength: 2048
                key:
                  type: string
                  maxLength: 4096
                clear_key:
                  type: boolean
              required:
              - base_url
      responses:
        '200':
          description: Safe provider status; submitted key is never returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompatibleProviderStatus'
        '400':
          description: Invalid provider endpoint or key
        '401':
          description: Authentication required
        '403':
          description: Owner required
      security:
      - browserSession: []
  /jobs/{id}/approve:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    post:
      description: Approve fresh pending job
      responses:
        '200':
          description: Approve fresh pending job
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  approved: *id001
        '400':
          description: Invalid bounded request
        '401':
          description: Authentication required
        '403':
          description: Access denied
        '409':
          description: State unavailable or expired
  /jobs/{id}/cancel:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    post:
      description: Cancel eligible work; submitted messages cannot be recalled
      responses:
        '200':
          description: Cancel eligible work; submitted messages cannot be recalled
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  cancelled: *id001
        '400':
          description: Invalid bounded request
        '401':
          description: Authentication required
        '403':
          description: Access denied
        '409':
          description: State unavailable or expired
  /playground:
    post:
      description: Offline preview of saved commands, including disabled recipes;
        never sends or calls a provider
      responses:
        '200':
          description: Offline preview of saved commands, including disabled recipes;
            never sends or calls a provider
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  text: &id002
                    type: string
                  model: *id002
                  simulated:
                    type: boolean
                    const: true
        '400':
          description: Invalid bounded request
        '401':
          description: Authentication required
        '403':
          description: Access denied
        '409':
          description: State unavailable or expired
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                command: *id002
                input:
                  type: string
                  maxLength: 12000
              required:
              - command
  /recipes/export:
    get:
      description: Configuration recipe with commands disabled and sender restrictions
        removed; no keys
      responses:
        '200':
          description: Configuration recipe with commands disabled and sender restrictions
            removed; no keys
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Configuration'
        '400':
          description: Invalid bounded request
        '401':
          description: Authentication required
        '403':
          description: Access denied
        '409':
          description: State unavailable or expired
  /recipes/import:
    post:
      description: Validate server recipe, reject sender restrictions, replace configuration
        with commands disabled
      responses:
        '200':
          description: Validate server recipe, reject sender restrictions, replace
            configuration with commands disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Configuration'
        '400':
          description: Invalid bounded request
        '401':
          description: Authentication required
        '403':
          description: Access denied
        '409':
          description: State unavailable or expired
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                configuration:
                  $ref: '#/components/schemas/Configuration'
              required:
              - configuration
  /conversations/{id}/history:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    get:
      description: Stable pages of encrypted retained text; search scans one bounded
        page and may return no matches plus a next cursor
      responses:
        '200':
          description: Stable pages of encrypted retained text; search scans one bounded
            page and may return no matches plus a next cursor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboxPage'
        '400':
          description: Invalid bounded request
        '401':
          description: Authentication required
        '403':
          description: Access denied
        '409':
          description: State unavailable or expired
      parameters:
      - name: cursor
        in: query
        schema: *id002
      - name: search
        in: query
        schema: *id002
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
  /conversations/{id}/history/import:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    post:
      description: Explicitly import an available phone text page within retention.
        Rechecks exact enrollment; imported commands never run. Attachments excluded;
        exhausted pages do not prove complete Google history.
      responses:
        '200':
          description: Explicitly import an available phone text page within retention.
            Rechecks exact enrollment; imported commands never run. Attachments excluded;
            exhausted pages do not prove complete Google history.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  imported: &id003
                    type: integer
                  next_cursor: *id002
                  available_pages_exhausted: *id001
                  text_only: *id001
                  observed_at: *id002
        '400':
          description: Invalid bounded request
        '401':
          description: Authentication required
        '403':
          description: Access denied
        '409':
          description: State unavailable or expired
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                cursor: *id002
  /conversations/{id}/compose:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    post:
      description: Queue an explicit manual message after trust, pause, readiness,
        quiet-hour and rate checks; no automatic replay
      responses:
        '202':
          description: Queue an explicit manual message after trust, pause, readiness,
            quiet-hour and rate checks; no automatic replay
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  id: *id002
                  queued: *id001
        '400':
          description: Invalid bounded request
        '401':
          description: Authentication required
        '403':
          description: Access denied
        '409':
          description: State unavailable or expired
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                text:
                  type: string
                  minLength: 1
                  maxLength: 12000
              required:
              - text
  /inbox/settings:
    get:
      description: Read encrypted owner inbox preferences
      security:
      - browserSession: []
      responses:
        '200':
          description: Read encrypted owner inbox preferences
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnerInboxSettings'
        '401':
          description: Authentication required
        '403':
          description: Owner required
        '409':
          description: Unavailable or stale settings revision
    put:
      description: Save owner inbox preferences using optimistic revision
      security:
      - browserSession: []
      responses:
        '200':
          description: Save owner inbox preferences using optimistic revision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnerInboxSettings'
        '401':
          description: Authentication required
        '403':
          description: Owner required
        '409':
          description: Unavailable or stale settings revision
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OwnerInboxSettings'
  /inbox/conversations:
    get:
      description: Discover another page of individual conversations
      security:
      - browserSession: []
      responses:
        '200':
          description: Discover another page of individual conversations
          content:
            application/json:
              schema:
                type: object
                properties:
                  conversations:
                    type: array
                    items:
                      $ref: '#/components/schemas/Conversation'
                  partial:
                    type: boolean
                    description: Some conversations could not be resolved; available entries are shown.
                  next_cursor:
                    type: string
        '401':
          description: Authentication required
        '403':
          description: Owner required
        '409':
          description: Unavailable or stale settings revision
        '503':
          description: Phone discovery unavailable
      parameters:
      - name: cursor
        in: query
        schema:
          type: string
          maxLength: 4096
  /inbox/conversations/{id}/history:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    get:
      description: Read owner-only retained history after checking current identity
        and access
      security:
      - browserSession: []
      responses:
        '200':
          description: Read owner-only retained history after checking current identity
            and access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboxPage'
        '401':
          description: Authentication required
        '403':
          description: Owner required
        '409':
          description: Unavailable or stale settings revision
      parameters:
      - name: cursor
        in: query
        schema:
          type: string
      - name: search
        in: query
        schema:
          type: string
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
  /inbox/conversations/{id}/history/import:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    post:
      description: Fetch an available message/file-reference page; historical commands never run
      security:
      - browserSession: []
      responses:
        '200':
          description: Saved new-row count, duplicate/skipped counts, next cursor and available-page exhaustion; exhaustion does not establish completeness
        '401':
          description: Authentication required
        '403':
          description: Owner required
        '409':
          description: Unavailable or stale settings revision
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                cursor:
                  type: string
                  maxLength: 4096
  /inbox/conversations/{id}/compose:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    post:
      description: Queue confirmed owner manual reply with idempotency key; pause and
        final access checks apply. Optional attachments are base64 bytes. Owner-configured
        attachment_limits control count, per-file MiB and combined MiB; each zero disables that limit. Empty text is allowed when files are supplied.
        The request key binds the text, file names, MIME types and exact bytes.
      security:
      - browserSession: []
      responses:
        '401':
          description: Authentication required
        '403':
          description: Owner required
        '409':
          description: Unavailable or stale settings revision
        '202':
          description: Queued once; does not establish delivery
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - text
              - request_id
              properties:
                text:
                  type: string
                  maxLength: 12000
                attachments:
                  type: array
                  items:
                    $ref: '#/components/schemas/AttachmentUpload'
                request_id:
                  type: string
                  minLength: 16
                  maxLength: 100
  /inbox/conversations/{id}/messages/{message}/attachments/{attachment}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    - name: message
      in: path
      required: true
      schema:
        type: string
    - name: attachment
      in: path
      required: true
      schema:
        type: string
    get:
      description: Owner-only file content with current inbox consent and exact conversation identity checks. Remote media is fetched on demand. Never cached by the app. Range requests are supported. Active documents are always downloads.
      security:
      - browserSession: []
      parameters:
      - name: inline
        in: query
        schema:
          type: string
          enum: ['1']
        description: Inline presentation for an allowlist of image, audio and video types only.
      responses:
        '200':
          description: File bytes with safe Content-Disposition and no-store headers
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '206':
          description: Requested byte range
        '401':
          description: Authentication required
        '403':
          description: Owner required
        '409':
          description: File unavailable or inbox access revoked
        '413':
          description: File exceeds the configured per-file download limit
        '416':
          description: Unsatisfiable byte range

  /inbox/archive/stats:
    get:
      summary: Owner-only local archive storage metrics (archive_stats capability)
      responses:
        '200':
          description: >-
            original_bytes, original_files, database_bytes (shared database plus WAL/SHM),
            export_bytes, temporary_bytes, total_bytes, messages (archived conversations),
            quota_bytes (original-file quota; zero means unlimited), measured_at (RFC3339).
            Disk measurements are approximate during concurrent downloads, exports and cleanup.
        '403': {description: Owner required}
        '503': {description: Measurement unavailable; never reported as zero usage}
  /inbox/archive:
    get:
      summary: Owner-only retained archive identities and durable sync progress
      responses:
        '200':
          description: >-
            Archive records, including stopped/offline conversations; never collection consent.
            retry_at/failures/error describe deep backfill; recent_retry_at/recent_failures/recent_error
            describe independent recent reconciliation backoff. Error values are sanitized codes.
  /inbox/conversations/{id}/sync:
    parameters:
    - name: id
      in: path
      required: true
      schema: {type: string}
    post:
      summary: Start/resume a history scan or cancel the current import
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                since: {type: string, description: 'RFC3339 cutoff, or empty for all available history'}
                cancel: {type: boolean}
      responses:
        '200': {description: Durable archive job with generation and progress}
        '409': {description: Invalid cutoff, unavailable transport or access disabled}
  /inbox/conversations/{id}/changes:
    parameters:
    - name: id
      in: path
      required: true
      schema: {type: string}
    get:
      summary: Owner-only local archive changes, including edits to old messages
      parameters:
      - name: after
        in: query
        required: true
        schema: {type: integer, minimum: 0}
      responses:
        '200': {description: 'messages, deleted IDs, cursor and more; keep paging until more is false'}
  /inbox/conversations/{id}/revisions/{message}:
    parameters:
    - {name: id, in: path, required: true, schema: {type: string}}
    - {name: message, in: path, required: true, schema: {type: string}}
    get:
      summary: Owner-only previously observed content revisions, not guaranteed upstream edit history
      responses:
        '200': {description: Previous text snapshots with local observation timestamps}

  /inbox/archive/files/policy:
    get:
      summary: Owner-only original preservation policy
      responses:
        '200': {description: 'enabled, max_file_mb and quota_mb; zero limits mean unlimited'}
    put:
      summary: Set original preservation policy independently of sending/viewing limits
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                enabled: {type: boolean}
                max_file_mb: {type: integer, minimum: 0}
                quota_mb: {type: integer, minimum: 0}
      responses:
        '200': {description: Saved policy}
        '400': {description: Invalid policy}
  /inbox/archive/backup:
    get:
      summary: Owner-only persistent export job status
      responses:
        '200': {description: 'Job or null; state, scope, sanitized error and message/original/missing/byte counts'}
    post:
      summary: Start a consistent local archive export; matching concurrent starts reuse the running job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                plaintext: {type: boolean, default: false}
                conversations: {type: array, maxItems: 500, items: {type: string}}
                since: {type: string, description: 'RFC3339 cutoff or empty'}
      responses:
        '202': {description: Running job; starting a new job removes the preceding server package}
        '409': {description: Invalid scope or export unavailable/busy}
    delete:
      summary: Delete the completed server export package and job status
      responses:
        '200': {description: Deleted}
        '409': {description: Export running or file removal failed}
  /inbox/archive/backup/cancel:
    post:
      summary: Cancel the current export without publishing a partial package
      responses:
        '200': {description: Cancellation requested}
  /inbox/archive/backup/{job}/file:
    parameters:
    - {name: job, in: path, required: true, schema: {type: string}}
    get:
      summary: Download completed encrypted SMA or readable TAR export; owner cookie required
      responses:
        '200': {description: Completed package with attachment disposition and no-store}
        '206': {description: Requested byte range}
        '409': {description: Job incomplete or no longer available}

components:
  securitySchemes:
    browserSession:
      type: apiKey
      in: cookie
      name: smsbot_session
    clientCredential:
      type: http
      scheme: bearer
  schemas:
    State:
      type: object
      required:
      - api_version
      - paused
      - transport_ready
      - transport
      - fixture
      - capabilities
      properties:
        inbox_capture_gap:
          type: boolean
          description: Owner-only pending history-verification warning; ranges are not confirmed outages or proof of missing messages.
        api_version:
          type: integer
          const: 1
        paused:
          type: boolean
        transport_ready:
          type: boolean
        transport:
          type: string
          enum:
          - fixture
          - google_messages
        fixture:
          type: boolean
        capabilities:
          type: array
          items:
            type: string
    Conversation:
      type: object
      properties:
        archived: {type: boolean}
        id:
          type: string
        participant_id:
          type: string
        label:
          type: string
        protocol:
          type: string
        group:
          type: boolean
        writable:
          type: boolean
        enrolled:
          type: boolean
    Job:
      type: object
      properties:
        id:
          type: string
        conversation_id:
          type: string
        command:
          type: string
        state:
          type: string
          enum:
          - queued
          - submitting
          - submitted
          - delivered
          - read
          - cancelled
          - failed
          - expired
          - unknown_submission
          - generating
          - awaiting_approval
        created_at:
          type: string
          format: date-time
        transaction_id:
          type: string
        code:
          type: string
        prompt_tokens: *id003
        completion_tokens: *id003
        reasoning_tokens: *id003
        model: *id002
        cost: &id004
          type: number
        requested_reasoning: *id002
    Generation:
      type: object
      additionalProperties: false
      properties:
        reasoning:
          type: string
          enum:
          - default
          - 'off'
          - minimal
          - low
          - medium
          - high
          - xhigh
          - max
        answer_length:
          type: string
          enum:
          - short
          - standard
          - detailed
        tokens:
          type: integer
          minimum: 128
          maximum: 8192
        temperature:
          type:
          - number
          - 'null'
          minimum: 0
          maximum: 2
      required:
      - reasoning
      - answer_length
      - tokens
    Settings:
      type: object
      additionalProperties: false
      properties:
        hourly_limit: *id003
        daily_limit: *id003
        quiet_start: *id003
        quiet_end: *id003
        memory_hours: *id003
        retention_days: *id003
        max_chars: *id003
        default_model: *id002
        daily_budget: *id004
        quiet_enabled: *id001
        timezone: *id002
        favorites:
          type: array
          items: *id002
        model_generation:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Generation'
    Command:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          pattern: ^[a-z][a-z0-9_-]{0,23}$
        description: *id002
        instructions: *id002
        type:
          type: string
          enum:
          - ai
          - fixed
        enabled: *id001
        memory: *id001
        approval: *id001
        model: *id002
        profile_id: *id002
        allowed_conversations:
          type: array
          items: *id002
        generation:
          $ref: '#/components/schemas/Generation'
      required:
      - name
      - type
      - instructions
    Profile:
      type: object
      additionalProperties: false
      properties:
        id: *id002
        name: *id002
        model: *id002
        instructions: *id002
      required:
      - id
      - name
    Configuration:
      type: object
      additionalProperties: false
      properties:
        settings:
          $ref: '#/components/schemas/Settings'
        commands:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/Command'
        profiles:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/Profile'
      required:
      - settings
      - commands
      - profiles
    Model:
      type: object
      additionalProperties: false
      properties:
        id: *id002
        name: *id002
        provider: *id002
        remote_id: *id002
        context_length: *id003
        parameters:
          type: array
          items: *id002
        has_reasoning: *id001
        reasoning_mandatory: *id001
        reasoning_efforts:
          type:
          - array
          - 'null'
          items: *id002
        input_price: *id004
        output_price: *id004
        pricing_known: *id001
    CompatibleProviderStatus:
      type: object
      additionalProperties: false
      properties:
        base_url: *id002
        configured: *id001
      required:
      - base_url
      - configured
    Attachment:
      type: object
      additionalProperties: false
      required: [id, name, mime, size]
      properties:
        id:
          type: string
        name:
          type: string
        mime:
          type: string
        size:
          type: integer
          minimum: 0
    AttachmentUpload:
      type: object
      additionalProperties: false
      required: [name, data]
      properties:
        name:
          type: string
        mime:
          type: string
        data:
          type: string
          format: byte
          contentEncoding: base64
          description: Nonempty file bytes; configured per-file and combined limits apply unless set to zero.
    Message:
      type: object
      additionalProperties: false
      properties:
        revision: {type: integer, minimum: 0}
        id: *id002
        direction:
          type: string
          enum:
          - incoming
          - outgoing
        at:
          type: string
          format: date-time
        text: *id002
        attachments:
          type: array
          description: Present on owner full-inbox history only. File keys, remote locators and bytes are never included.
          items:
            $ref: '#/components/schemas/Attachment'
        origin:
          type: string
        status:
          type: string
    InboxPage:
      type: object
      additionalProperties: false
      properties:
        messages:
          type: array
          items:
            $ref: '#/components/schemas/Message'
        change_cursor: {type: integer, minimum: 0}
        next_cursor: *id002
      required:
      - messages
      - next_cursor

    AttachmentLimits:
      type: object
      additionalProperties: false
      required: [max_files, max_file_mb, max_total_mb]
      description: Owner attachment limits. Zero means Unlimited independently. Missing limits use defaults 4 files, 10 MiB each, 20 MiB combined. These are application limits, not upstream/carrier guarantees.
      properties:
        max_files:
          type: integer
          minimum: 0
        max_file_mb:
          type: integer
          minimum: 0
        max_total_mb:
          type: integer
          minimum: 0
    OwnerInboxSettings:
      type: object
      additionalProperties: false
      required:
      - enabled
      - scope
      - conversations
      - load_older
      - automatic_replies
      - revision
      properties:
        archive_retention_days: {type: integer, minimum: 0, maximum: 3650, default: 0}
        attachment_limits:
          $ref: '#/components/schemas/AttachmentLimits'
        enabled:
          type: boolean
          default: false
        scope:
          type: string
          enum:
          - all
          - selected
        conversations:
          type: array
          maxItems: 500
          items:
            type: object
            additionalProperties: false
            required:
            - conversation
            - participant
            properties:
              conversation:
                type: string
              participant:
                type: string
        load_older:
          type: boolean
          default: false
        automatic_replies:
          type: boolean
          default: true
        revision:
          type: integer
          minimum: 0
