openapi: 3.1.0
info:
  title: SmsBot control API
  version: 1.1.0
  description: Server commands, configuration, retained messages, owner-only attachments and control API.
    Fixture transport/provider are offline. Every call needs an owner browser
    session and mutations require the exact Origin. New optional capabilities are
    advertised by state.
servers:
- url: /api/v1
security:
- browserSession: []
paths:
  /login:
    post:
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - token
              additionalProperties: false
              properties:
                token:
                  type: string
                  writeOnly: true
                remember:
                  type: boolean
                  description: Keep the session until sign-out or revoke-all instead of 12 hours; the cookie renews while in use.
      responses:
        '200':
          description: HttpOnly owner session established
        '401':
          description: Invalid credentials
  /logout:
    post:
      responses:
        '200':
          description: Session revoked
  /sessions/revoke:
    post:
      description: Owner only. Signs out every browser session, including the caller's.
      responses:
        '200':
          description: All browser sessions revoked
  /state:
    get:
      responses:
        '200':
          description: Current process/transport/bot state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/State'
  /pause:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - paused
              additionalProperties: false
              properties:
                paused:
                  type: boolean
      responses:
        '200':
          description: Pause acknowledged, eligible queued requests cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/State'
  /enrollment:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - conversation_id
              - participant_id
              additionalProperties: false
              properties:
                conversation_id:
                  type: string
                participant_id:
                  type: string
                  description: The exact participant of an individual conversation, or for a group the member being enrolled.
                roster:
                  type: string
                  description: Required to enroll a member of a group. The conversation's `roster` as the owner saw it. The member then may use the bot in that group, but only while the group has exactly those people.
      responses:
        '200':
          description: Exact individual participant, or group member, enrolled
        '400':
          description: Ineligible conversation, identity mismatch, or a roster that is not the group's
        '409':
          description: group_needs_approval; the group's people changed since others were enrolled, so approve the new roster first
  /enrollment/{id}/members/{member}:
    parameters:
    - {name: id, in: path, required: true, schema: {type: string}}
    - {name: member, in: path, required: true, schema: {type: string}}
    delete:
      description: Stop one member of a group using the bot there, and cancel work waiting for the group.
      responses:
        '200':
          description: Member removed
  /enrollment/{id}/approve:
    parameters:
    - {name: id, in: path, required: true, schema: {type: string}}
    post:
      description: After a group's people changed, approve the group as it is now for the enrolled members still in it. Members who left are removed and work waiting for the group is cancelled. The bot is silent in a group whose roster is not the approved one.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [roster]
              properties:
                roster:
                  type: string
                  description: The group's current `roster`, as the owner saw it.
      responses:
        '200':
          description: Approved
        '409':
          description: group_changed; the group has different people than the roster given
  /enrollment/{id}/shared:
    parameters:
    - {name: id, in: path, required: true, schema: {type: string}}
    put:
      description: Switch a group between one AI conversation for each person who uses the bot (the default) and one shared by everyone in it, the owner included. Either way the group's AI conversations are forgotten and work waiting for the group is cancelled. In a shared conversation each question is marked with who asked it, and only the owner can clear it with `!new`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [shared]
              properties:
                shared: {type: boolean}
      responses:
        '200':
          description: Saved
        '400':
          description: Not a group the owner can send to
  /enrollment/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    delete:
      responses:
        '200':
          description: Enrollment removed and queued work cancelled
  /activity:
    get:
      responses:
        '200':
          description: Latest 200 request metadata records, no message text
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Job'
  /fixture/incoming:
    post:
      description: Exists only in fixture mode; no Google/carrier/provider requests.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                conversation_id:
                  type: string
                participant_id:
                  type: string
                text:
                  type: string
                at:
                  type: string
                  format: date-time
                historical:
                  type: boolean
                outgoing:
                  type: boolean
      responses:
        '200':
          description: Accepted boolean and fixture message ID
        '404':
          description: Unavailable in live mode
  /config:
    get:
      description: Encrypted server bot configuration
      responses:
        '200':
          description: Encrypted server bot configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Configuration'
        '400':
          description: Invalid bounded request
        '401':
          description: Authentication required
        '403':
          description: Access denied
        '409':
          description: State unavailable or expired
    put:
      description: Replace validated configuration; queued generation snapshots are
        unchanged
      responses:
        '200':
          description: Replace validated configuration; queued generation snapshots
            are unchanged
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Configuration'
        '400':
          description: Invalid bounded request
        '401':
          description: Authentication required
        '403':
          description: Access denied
        '409':
          description: State unavailable or expired
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Configuration'
  /models:
    get:
      description: Cached public model catalog; no implicit provider request
      responses:
        '200':
          description: Cached public model catalog; no implicit provider request
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Model'
        '400':
          description: Invalid bounded request
        '401':
          description: Authentication required
        '403':
          description: Access denied
        '409':
          description: State unavailable or expired
  /models/refresh:
    post:
      description: Explicit OpenRouter catalog refresh; unavailable in fixture mode
      responses:
        '200':
          description: Explicit OpenRouter catalog refresh; unavailable in fixture
            mode
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Model'
        '400':
          description: Invalid bounded request
        '401':
          description: Authentication required
        '403':
          description: Access denied
        '409':
          description: State unavailable or expired
  /models/refresh-compatible:
    post:
      description: Explicit authenticated refresh of the configured OpenAI-compatible catalog; unavailable in fixture mode
      responses:
        '200':
          description: Combined cached model catalog with the compatible provider refreshed
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Model'
        '401':
          description: Authentication required
        '403':
          description: Access denied
        '409':
          description: Fixture catalog is offline
        '502':
          description: Provider catalog request failed
  /provider-key:
    get:
      description: Owner-only configured flag; key never returned
      responses:
        '200':
          description: Owner-only configured flag; key never returned
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  configured: &id001
                    type: boolean
        '400':
          description: Invalid bounded request
        '401':
          description: Authentication required
        '403':
          description: Access denied
        '409':
          description: State unavailable or expired
      security:
      - browserSession: []
    put:
      description: Owner-only encrypted provider key replacement; empty clears it
      responses:
        '200':
          description: Owner-only encrypted provider key replacement; empty clears
            it
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  configured: *id001
        '400':
          description: Invalid bounded request
        '401':
          description: Authentication required
        '403':
          description: Access denied
        '409':
          description: State unavailable or expired
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                key:
                  type: string
                  maxLength: 4096
              required:
              - key
      security:
      - browserSession: []
  /compatible-provider:
    get:
      description: Owner-only compatible API endpoint and configured flag; key never returned
      responses:
        '200':
          description: Safe provider status; key never returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompatibleProviderStatus'
        '401':
          description: Authentication required
        '403':
          description: Owner required
      security:
      - browserSession: []
    put:
      description: Owner-only encrypted compatible API endpoint and optional key update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                base_url:
                  type: string
                  maxLength: 2048
                key:
                  type: string
                  maxLength: 4096
                clear_key:
                  type: boolean
              required:
              - base_url
      responses:
        '200':
          description: Safe provider status; submitted key is never returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompatibleProviderStatus'
        '400':
          description: Invalid provider endpoint or key
        '401':
          description: Authentication required
        '403':
          description: Owner required
      security:
      - browserSession: []
  /jobs/{id}/approve:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    post:
      description: Approve fresh pending job
      responses:
        '200':
          description: Approve fresh pending job
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  approved: *id001
        '400':
          description: Invalid bounded request
        '401':
          description: Authentication required
        '403':
          description: Access denied
        '409':
          description: State unavailable or expired
  /jobs/{id}/cancel:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    post:
      description: Cancel eligible work; submitted messages cannot be recalled
      responses:
        '200':
          description: Cancel eligible work; submitted messages cannot be recalled
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  cancelled: *id001
        '400':
          description: Invalid bounded request
        '401':
          description: Authentication required
        '403':
          description: Access denied
        '409':
          description: State unavailable or expired
  /playground:
    post:
      description: Offline preview of saved commands, including disabled recipes;
        never sends or calls a provider
      responses:
        '200':
          description: Offline preview of saved commands, including disabled recipes;
            never sends or calls a provider
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  text: &id002
                    type: string
                  model: *id002
                  simulated:
                    type: boolean
                    const: true
        '400':
          description: Invalid bounded request
        '401':
          description: Authentication required
        '403':
          description: Access denied
        '409':
          description: State unavailable or expired
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                command: *id002
                input:
                  type: string
                  maxLength: 12000
              required:
              - command
  /recipes/export:
    get:
      description: Configuration recipe with commands disabled and sender restrictions
        removed; no keys
      responses:
        '200':
          description: Configuration recipe with commands disabled and sender restrictions
            removed; no keys
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Configuration'
        '400':
          description: Invalid bounded request
        '401':
          description: Authentication required
        '403':
          description: Access denied
        '409':
          description: State unavailable or expired
  /recipes/import:
    post:
      description: Validate server recipe, reject sender restrictions, replace configuration
        with commands disabled
      responses:
        '200':
          description: Validate server recipe, reject sender restrictions, replace
            configuration with commands disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Configuration'
        '400':
          description: Invalid bounded request
        '401':
          description: Authentication required
        '403':
          description: Access denied
        '409':
          description: State unavailable or expired
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                configuration:
                  $ref: '#/components/schemas/Configuration'
              required:
              - configuration
  /conversations/{id}/history:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    get:
      description: Stable pages of encrypted retained text; search scans one bounded
        page and may return no matches plus a next cursor
      responses:
        '200':
          description: Stable pages of encrypted retained text; search scans one bounded
            page and may return no matches plus a next cursor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboxPage'
        '400':
          description: Invalid bounded request
        '401':
          description: Authentication required
        '403':
          description: Access denied
        '409':
          description: State unavailable or expired
      parameters:
      - name: cursor
        in: query
        schema: *id002
      - name: search
        in: query
        schema: *id002
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
  /conversations/{id}/history/import:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    post:
      description: Explicitly import an available phone text page within retention.
        Rechecks exact enrollment; imported commands never run. Attachments excluded;
        exhausted pages do not prove complete Google history.
      responses:
        '200':
          description: Explicitly import an available phone text page within retention.
            Rechecks exact enrollment; imported commands never run. Attachments excluded;
            exhausted pages do not prove complete Google history.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  imported: &id003
                    type: integer
                  next_cursor: *id002
                  available_pages_exhausted: *id001
                  text_only: *id001
                  observed_at: *id002
        '400':
          description: Invalid bounded request
        '401':
          description: Authentication required
        '403':
          description: Access denied
        '409':
          description: State unavailable or expired
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                cursor: *id002
  /conversations/{id}/compose:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    post:
      description: Queue an explicit manual message after trust, pause, readiness,
        quiet-hour and rate checks; no automatic replay
      responses:
        '202':
          description: Queue an explicit manual message after trust, pause, readiness,
            quiet-hour and rate checks; no automatic replay
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  id: *id002
                  queued: *id001
        '400':
          description: Invalid bounded request
        '401':
          description: Authentication required
        '403':
          description: Access denied
        '409':
          description: State unavailable or expired
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                text:
                  type: string
                  minLength: 1
                  maxLength: 12000
              required:
              - text
  /inbox/settings:
    get:
      description: Read encrypted owner inbox preferences
      security:
      - browserSession: []
      responses:
        '200':
          description: Read encrypted owner inbox preferences
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnerInboxSettings'
        '401':
          description: Authentication required
        '403':
          description: Owner required
        '409':
          description: Unavailable or stale settings revision
    put:
      description: Save owner inbox preferences using optimistic revision
      security:
      - browserSession: []
      responses:
        '200':
          description: Save owner inbox preferences using optimistic revision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnerInboxSettings'
        '401':
          description: Authentication required
        '403':
          description: Owner required
        '409':
          description: Unavailable or stale settings revision
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OwnerInboxSettings'
  /inbox/conversations:
    get:
      description: Discover another page of individual conversations
      security:
      - browserSession: []
      responses:
        '200':
          description: Discover another page of individual conversations
          content:
            application/json:
              schema:
                type: object
                properties:
                  conversations:
                    type: array
                    items:
                      $ref: '#/components/schemas/Conversation'
                  partial:
                    type: boolean
                    description: Some conversations could not be resolved; available entries are shown.
                  stale:
                    type: boolean
                    description: Optional. The page was read from the phone before its latest reported activity; phone reads are spaced, so ask again shortly.
                  next_cursor:
                    type: string
        '401':
          description: Authentication required
        '403':
          description: Owner required
        '409':
          description: Unavailable or stale settings revision
        '503':
          description: Phone discovery unavailable
      parameters:
      - name: cursor
        in: query
        schema:
          type: string
          maxLength: 4096
      - name: refresh
        in: query
        description: Optional. `1` asks for one fresh phone read of the list, for changes the phone may not push. Honoured at most once a minute across clients; otherwise the current list is returned. Omit for ordinary reads.
        schema:
          type: string
          enum:
          - '1'
  /inbox/typing:
    get:
      description: Individual conversations whose other participant is typing now. Owner only, in memory, expires within seconds; empty unless collection is enabled for the conversation.
      security:
      - browserSession: []
      responses:
        '200':
          description: Typing conversations
          content:
            application/json:
              schema:
                type: object
                required:
                - conversations
                properties:
                  conversations:
                    type: array
                    items:
                      type: string
        '403':
          description: Owner required
  /inbox/conversations/{id}/read:
    post:
      description: Mark an individual conversation read on the phone through the newest message the owner saw. Requires collection access, an exact participant match and the mark-read setting; never sends a message or changes Live/Pause. Throttled per conversation.
      security:
      - browserSession: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - through
              properties:
                through:
                  type: string
                  format: date-time
      responses:
        '200':
          description: Marked read, or already read or throttled
        '400':
          description: Invalid time
        '403':
          description: Owner required
        '409':
          description: Not allowed or unavailable (read_receipts_disabled, inbox_access_disabled, newer_message, ineligible_conversation, conversation_identity_changed, archive_identity_changed, read_unavailable)
  /inbox/conversations/{id}/history:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    get:
      description: Read owner-only retained history after checking current identity
        and access
      security:
      - browserSession: []
      responses:
        '200':
          description: Read owner-only retained history after checking current identity
            and access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboxPage'
        '401':
          description: Authentication required
        '403':
          description: Owner required
        '409':
          description: Unavailable or stale settings revision
      parameters:
      - name: cursor
        in: query
        schema:
          type: string
      - name: search
        in: query
        schema:
          type: string
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
  /inbox/conversations/{id}/history/import:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    post:
      description: Fetch an available message/file-reference page; historical commands never run
      security:
      - browserSession: []
      responses:
        '200':
          description: Saved new-row count, duplicate/skipped counts, next cursor and available-page exhaustion; exhaustion does not establish completeness
        '401':
          description: Authentication required
        '403':
          description: Owner required
        '409':
          description: Unavailable or stale settings revision
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                cursor:
                  type: string
                  maxLength: 4096
  /inbox/conversations/{id}/compose:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    post:
      description: Queue confirmed owner manual reply with idempotency key; pause and
        final access checks apply. Optional attachments are base64 bytes. Owner-configured
        attachment_limits control count, per-file MiB and combined MiB; each zero disables that limit. Empty text is allowed when files are supplied.
        The phone may accept but never deliver a message that combines several files, or a file and text, so send each file and the text as separate requests, as the dashboard does.
        The request key binds the text, file names, MIME types, exact bytes and optional reply target.
        Quoted replies require a locally collected RCS target in this conversation and current RCS capability; they never silently downgrade to SMS.
      security:
      - browserSession: []
      responses:
        '401':
          description: Authentication required
        '403':
          description: Owner required
        '409':
          description: Unavailable or stale settings revision
        '202':
          description: Queued once; does not establish delivery
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - text
              - request_id
              properties:
                text:
                  type: string
                  maxLength: 12000
                attachments:
                  type: array
                  items:
                    $ref: '#/components/schemas/AttachmentUpload'
                request_id:
                  type: string
                  minLength: 16
                  maxLength: 100
                reply_to:
                  type: string
                  maxLength: 128
                  description: Optional local message ID to quote. Resolved to an encrypted upstream identity on the server; never a raw upstream ID.
                roster:
                  type: string
                  description: Required to send to a group. The conversation's `roster` as the owner saw it. The request is refused with `group_changed` (409) if the group has different people now, and a queued send is cancelled with `identity_changed` if they change before it goes.
  /inbox/conversations/{id}/messages/{message}/actions:
    parameters:
    - {name: id, in: path, required: true, schema: {type: string}}
    - {name: message, in: path, required: true, schema: {type: string}}
    get:
      summary: Per-message protocol and current action eligibility
      description: Owner only. Shared UI components use these flags rather than the conversation protocol label. Edit is false with editing_unavailable_in_companion_transport. SMS, MMS, unknown protocol, missing upstream IDs, changed identities, pause and unavailable collection fail closed for native RCS mutations.
      security: [{browserSession: []}]
      responses:
        '200':
          description: Current capability snapshot; every mutation repeats validation
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MessageActions'}
        '401': {description: Owner authentication required}
        '409': {description: Actions unavailable}
  /inbox/conversations/{id}/messages/{message}/reactions:
    parameters:
    - {name: id, in: path, required: true, schema: {type: string}}
    - {name: message, in: path, required: true, schema: {type: string}}
    post:
      summary: Queue an owner RCS emoji reaction change once
      description: Explicit add, switch or remove operation, bound to a capability version and idempotency key. Intent is encrypted and persisted before submission. An unresolved action blocks conflicting reactions on this target. Uncertain submissions are never automatically retried. Image reactions are not supported.
      security: [{browserSession: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [emoji, operation, version, request_id]
              properties:
                emoji: {type: string, maxLength: 64, description: Unicode emoji including supported variation selectors and composed sequences}
                operation: {type: string, enum: [add, switch, remove]}
                version: {type: string, description: Version returned by message actions}
                request_id: {type: string, minLength: 16, maxLength: 100}
                roster: {type: string, description: Required in a group. The conversation's `roster` as the owner saw it. A reaction in a group is seen by everyone in it, so it is refused with `group_changed` if the group has different people now, and cancelled if they change before it goes.}
      responses:
        '202':
          description: Original or newly queued action ID; not delivery confirmation
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: {type: string}
                  queued: {type: boolean}
        '401': {description: Owner authentication required}
        '409': {description: 'invalid_reaction, reaction_conflict, reaction_unavailable, group_changed or request_id_reused_with_different_action'}
  /inbox/conversations/{id}/actions/{action}:
    parameters:
    - {name: id, in: path, required: true, schema: {type: string}}
    - {name: action, in: path, required: true, schema: {type: string}}
    get:
      summary: Owner reaction submission and observation status
      description: Submitted means accepted by the transport and waiting for an authoritative snapshot. The reaction_confirmed state means the intended reaction was observed, independently of message read receipts. Unknown submission remains blocked until reconciled. No raw provider errors are returned.
      security: [{browserSession: []}]
      responses:
        '200':
          description: Action status scoped to this conversation
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: {type: string}
                  state: {type: string, enum: [queued, generating, submitting, submitted, unknown_submission, reaction_confirmed, failed, cancelled, expired]}
                  code: {type: string}
        '401': {description: Owner authentication required}
        '404': {description: Action unavailable in this conversation}
  /inbox/conversations/{id}/messages/{message}/window:
    parameters:
    - {name: id, in: path, required: true, schema: {type: string}}
    - {name: message, in: path, required: true, schema: {type: string}}
    get:
      summary: Bounded local history window around a quoted original
      description: Owner archive access only. At most 50 retained messages around the exact local target. Does not fetch upstream history or prove that surrounding history is complete.
      security: [{browserSession: []}]
      responses:
        '200':
          description: Local message window
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InboxPage'}
        '401': {description: Owner authentication required}
        '404': {description: Archive or original message unavailable}
  /inbox/conversations/{id}/messages/{message}/attachments/{attachment}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    - name: message
      in: path
      required: true
      schema:
        type: string
    - name: attachment
      in: path
      required: true
      schema:
        type: string
    get:
      description: Owner-only file content with current inbox consent and exact conversation identity checks. Remote media is fetched on demand. Never cached by the app. Range requests are supported. Active documents are always downloads. An inline request for a HEIC or HEIF photo is answered with a JPEG of it (415 image_unreadable if it can't be read); without `inline` the original is downloaded.
      security:
      - browserSession: []
      parameters:
      - name: inline
        in: query
        schema:
          type: string
          enum: ['1']
        description: Inline presentation for an allowlist of image, audio and video types only.
      responses:
        '200':
          description: File bytes with safe Content-Disposition and no-store headers
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '206':
          description: Requested byte range
        '401':
          description: Authentication required
        '403':
          description: Owner required
        '409':
          description: File unavailable or inbox access revoked
        '413':
          description: File exceeds the configured per-file download limit
        '416':
          description: Unsatisfiable byte range

  /inbox/archive/stats:
    get:
      summary: Owner-only local archive storage metrics (archive_stats capability)
      responses:
        '200':
          description: >-
            original_bytes, original_files, database_bytes (shared database plus WAL/SHM),
            export_bytes, temporary_bytes, total_bytes, messages (archived conversations),
            quota_bytes (original-file quota; zero means unlimited), measured_at (RFC3339).
            Disk measurements are approximate during concurrent downloads, exports and cleanup.
        '403': {description: Owner required}
        '503': {description: Measurement unavailable; never reported as zero usage}
  /inbox/archive:
    get:
      summary: Owner-only retained archive identities and durable sync progress
      responses:
        '200':
          description: >-
            Archive records, including stopped/offline conversations; never collection consent.
            retry_at/failures/error describe deep backfill; recent_retry_at/recent_failures/recent_error
            describe independent recent reconciliation backoff. Error values are sanitized codes.
            generation versions the import; refresh_generation (optional) versions the
            viewed-section check. Both are opaque counters.
  /inbox/conversations/{id}/sync:
    parameters:
    - name: id
      in: path
      required: true
      schema: {type: string}
    post:
      summary: Start/resume a history scan or cancel the current import
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                since: {type: string, description: 'RFC3339 cutoff, or empty for all available history'}
                cancel: {type: boolean}
      responses:
        '200': {description: Durable archive job with generation and progress}
        '409': {description: Invalid cutoff, unavailable transport or access disabled}
  /inbox/conversations/{id}/changes:
    parameters:
    - name: id
      in: path
      required: true
      schema: {type: string}
    get:
      summary: Owner-only local archive changes, including edits to old messages
      parameters:
      - name: after
        in: query
        required: true
        schema: {type: integer, minimum: 0}
      responses:
        '200': {description: 'messages, deleted IDs, cursor and more; keep paging until more is false'}
  /inbox/conversations/{id}/revisions/{message}:
    parameters:
    - {name: id, in: path, required: true, schema: {type: string}}
    - {name: message, in: path, required: true, schema: {type: string}}
    get:
      summary: Owner-only previously observed content revisions, not guaranteed upstream edit history
      responses:
        '200': {description: Previous text snapshots with local observation timestamps}

  /inbox/archive/files/policy:
    get:
      summary: Owner-only original preservation policy
      responses:
        '200': {description: 'enabled, max_file_mb and quota_mb; zero limits mean unlimited'}
    put:
      summary: Set original preservation policy independently of sending/viewing limits
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                enabled: {type: boolean}
                max_file_mb: {type: integer, minimum: 0}
                quota_mb: {type: integer, minimum: 0}
      responses:
        '200': {description: Saved policy}
        '400': {description: Invalid policy}
  /inbox/archive/backup:
    get:
      summary: Owner-only persistent export job status
      responses:
        '200': {description: 'Job or null; state, scope, sanitized error and message/original/missing/byte counts'}
    post:
      summary: Start a consistent local archive export; matching concurrent starts reuse the running job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                plaintext: {type: boolean, default: false}
                conversations: {type: array, maxItems: 500, items: {type: string}}
                since: {type: string, description: 'RFC3339 cutoff or empty'}
      responses:
        '202': {description: Running job; starting a new job removes the preceding server package}
        '409': {description: Invalid scope or export unavailable/busy}
    delete:
      summary: Delete the completed server export package and job status
      responses:
        '200': {description: Deleted}
        '409': {description: Export running or file removal failed}
  /inbox/archive/backup/cancel:
    post:
      summary: Cancel the current export without publishing a partial package
      responses:
        '200': {description: Cancellation requested}
  /inbox/archive/backup/{job}/file:
    parameters:
    - {name: job, in: path, required: true, schema: {type: string}}
    get:
      summary: Download completed encrypted SMA or readable TAR export; owner cookie required
      responses:
        '200': {description: Completed package with attachment disposition and no-store}
        '206': {description: Requested byte range}
        '409': {description: Job incomplete or no longer available}

  /notifications:
    get:
      summary: Web Push application server key and registered devices (capability push_notifications)
      description: Devices never include their push endpoint or keys. Each device has its own notification settings.
      responses:
        '200':
          description: Notification state
          content:
            application/json:
              schema:
                type: object
                required: [public_key, devices]
                properties:
                  public_key: {type: string, description: 'VAPID public key, base64url; generated once and kept'}
                  devices: {type: array, items: {$ref: '#/components/schemas/NotificationDevice'}}
        '500': {description: Keys or devices could not be read}
        '503': {description: Notifications not wired in this process}
  /notifications/devices:
    post:
      summary: Register this browser's push subscription
      description: >-
        The device ID derives from the endpoint, so registering again refreshes keys and keeps the
        label, settings and creation time. A new device starts with all messages and every alert on.
        With existing_only, a device that is not registered (for example removed from another device)
        is not re-created and the response is 404.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpoint, keys]
              properties:
                endpoint: {type: string, maxLength: 2048, description: 'HTTPS push service URL; local, private and tailnet hosts are refused'}
                keys:
                  type: object
                  required: [p256dh, auth]
                  properties:
                    p256dh: {type: string, maxLength: 200}
                    auth: {type: string, maxLength: 100}
                label: {type: string, maxLength: 60, description: 'Empty keeps the current label'}
                existing_only: {type: boolean, default: false}
      responses:
        '200': {description: Device, content: {application/json: {schema: {$ref: '#/components/schemas/NotificationDevice'}}}}
        '400': {description: Invalid subscription}
        '404': {description: existing_only and the device is not registered}
  /notifications/devices/{id}:
    parameters:
    - {name: id, in: path, required: true, schema: {type: string}}
    put:
      summary: Change one device's name and notification settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label, prefs]
              properties:
                label: {type: string, maxLength: 60}
                prefs: {$ref: '#/components/schemas/NotificationPrefs'}
      responses:
        '200': {description: Device, content: {application/json: {schema: {$ref: '#/components/schemas/NotificationDevice'}}}}
        '400': {description: Invalid settings}
        '404': {description: Unknown device}
    delete:
      summary: Stop notifications for a device
      responses:
        '200': {description: Removed}
        '404': {description: Unknown device}
  /notifications/devices/{id}/test:
    post:
      summary: Send a sample notification to one device
      responses:
        '200': {description: Accepted by the push service}
        '404': {description: Unknown device}
        '502': {description: 'Push service refused (test_not_delivered) or no longer knows the device (device_unsubscribed, which also removes it)'}

components:
  securitySchemes:
    browserSession:
      type: apiKey
      in: cookie
      name: smsbot_session
  schemas:
    NotificationPrefs:
      type: object
      required: [messages]
      properties:
        messages: {type: string, enum: [all, bot_on, chosen, off], description: 'Which incoming messages notify; alerts are separate'}
        conversations: {type: array, maxItems: 1000, items: {type: string}, description: 'Conversation IDs notified when messages is chosen'}
        muted: {type: array, maxItems: 1000, items: {type: string}, description: 'Conversation IDs never notified'}
        show_text: {type: boolean, description: 'Include message text; otherwise only the sender is shown'}
        approvals: {type: boolean, description: 'A reply awaits approval'}
        problems: {type: boolean, description: 'A reply failed or its delivery is uncertain'}
        connection: {type: boolean, description: 'The phone is unreachable for two minutes, and when it returns'}
    NotificationDevice:
      type: object
      required: [id, label, created, prefs]
      properties:
        id: {type: string}
        label: {type: string}
        created: {type: string, format: date-time}
        prefs: {$ref: '#/components/schemas/NotificationPrefs'}
    State:
      type: object
      required:
      - api_version
      - paused
      - transport_ready
      - transport
      - fixture
      - capabilities
      properties:
        phone_requests:
          type: object
          description: Owner-only in-memory adapter RPC attempt counts by kind, since the service started and in the last hour. Excludes internal libgm control requests; see phone_relay_requests. No identifiers or content. Absent for transports that do not report it.
          additionalProperties:
            type: object
            required:
            - total
            - last_hour
            properties:
              total:
                type: integer
                minimum: 0
              last_hour:
                type: integer
                minimum: 0
        phone_request_purposes:
          type: object
          description: Adapter RPC attempts grouped by a bounded purpose label. Values have the same total/last_hour fields as phone_requests. No identifiers or content.
          additionalProperties:
            type: object
            properties:
              total: {type: integer, minimum: 0}
              last_hour: {type: integer, minimum: 0}
        phone_request_coverage:
          type: string
          enum: [adapter_attempts_only]
          description: Coverage of phone_requests and phone_request_purposes; neither is a physical wake counter.
        phone_relay_requests:
          type: object
          description: Outbound SendMessage HTTP attempts including libgm control RPCs and HTTP retries, grouped by action. Accepted means Google returned HTTP 2xx, not execution on the phone. In-flight calls appear when the HTTP attempt finishes. Relay acknowledgments and media uploads/downloads are excluded. No payloads or identifiers are retained.
          additionalProperties:
            type: object
            properties:
              attempts: {type: integer, minimum: 0}
              accepted: {type: integer, minimum: 0}
              failed: {type: integer, minimum: 0}
              last_hour: {type: integer, minimum: 0}
        conversations_revision:
          type: string
          description: Owner-only counter that changes when the phone reports activity or a message is saved; the dashboard refetches its conversation list only when it changes.
        inbox_capture_gap:
          type: boolean
          description: Owner-only pending history-verification warning; ranges are not confirmed outages or proof of missing messages.
        api_version:
          type: integer
          const: 1
        paused:
          type: boolean
        transport_ready:
          type: boolean
        transport:
          type: string
          enum:
          - fixture
          - google_messages
        fixture:
          type: boolean
        capabilities:
          type: array
          items:
            type: string
    Conversation:
      type: object
      properties:
        archived: {type: boolean}
        id:
          type: string
        participant_id:
          type: string
          description: The other person in an individual conversation. A group has one fixed identity of its own, "group:" and its conversation ID, so people joining or leaving doesn't change it.
        label:
          type: string
        protocol:
          type: string
        group:
          type: boolean
        members:
          type: array
          description: The people in a group, other than the owner. Absent for individual conversations.
          items:
            type: object
            properties:
              id: {type: string}
              name: {type: string}
        roster:
          type: string
          description: A name for exactly who is in a group right now. Groups are read and archived whoever is in them; anything that acts for a group checks the roster.
        writable:
          type: boolean
        enrolled:
          type: boolean
          description: For a group, true if any member is enrolled.
        enrolled_members:
          type: array
          items: {type: string}
          description: For a group, the members who may use the bot there.
        bot_roster:
          type: string
          description: For a group, the roster approved for the enrolled members. The bot is silent unless it equals `roster`.
        shared_ai:
          type: boolean
          description: For a group, true when everyone who uses the bot there shares one AI conversation.
        last_message_at:
          type: string
          format: date-time
          description: Newest message time (phone list or newest saved local message). Owner inbox listing only; optional.
        unread:
          type: boolean
          description: Phone unread flag; optional display hint.
        pinned:
          type: boolean
          description: Phone pinned flag; optional display hint.
        preview:
          type: string
          description: Newest saved message text (at most 120 characters) for conversations the owner collects; owner inbox listing only.
        preview_from_me:
          type: boolean
    Job:
      type: object
      properties:
        id:
          type: string
        conversation_id:
          type: string
        command:
          type: string
        state:
          type: string
          enum:
          - queued
          - submitting
          - submitted
          - delivered
          - read
          - cancelled
          - failed
          - expired
          - unknown_submission
          - generating
          - awaiting_approval
        created_at:
          type: string
          format: date-time
        transaction_id:
          type: string
        code:
          type: string
        prompt_tokens: *id003
        completion_tokens: *id003
        reasoning_tokens: *id003
        model: *id002
        cost: &id004
          type: number
        requested_reasoning: *id002
    Generation:
      type: object
      additionalProperties: false
      properties:
        reasoning:
          type: string
          enum:
          - default
          - 'off'
          - minimal
          - low
          - medium
          - high
          - xhigh
          - max
        answer_length:
          type: string
          enum:
          - short
          - standard
          - detailed
        tokens:
          type: integer
          minimum: 128
          maximum: 8192
        temperature:
          type:
          - number
          - 'null'
          minimum: 0
          maximum: 2
      required:
      - reasoning
      - answer_length
      - tokens
    Settings:
      type: object
      additionalProperties: false
      properties:
        hourly_limit: *id003
        daily_limit: *id003
        quiet_start: *id003
        quiet_end: *id003
        memory_hours: *id003
        retention_days: *id003
        max_chars: *id003
        ai_photo_max_mb:
          type: integer
          minimum: 1
          maximum: 25
          description: Photos quoted with an AI command that are larger than this many
            megabytes are scaled down before they are sent to the provider. Photos over
            25 MB are refused. 5 when absent.
        default_model: *id002
        daily_budget: *id004
        quiet_enabled: *id001
        owner_commands:
          type: boolean
          description: Also run commands the owner sends, from their phone or
            the dashboard, in conversations with bot replies on. Off when absent.
        timezone: *id002
        favorites:
          type: array
          items: *id002
        model_generation:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Generation'
    Command:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          pattern: ^[a-z][a-z0-9_-]{0,23}$
        description: *id002
        instructions: *id002
        type:
          type: string
          enum:
          - ai
          - fixed
        enabled: *id001
        memory:
          type: boolean
          description: >-
            For the AI ask command, retain encrypted reply-linked threads. Each
            unquoted ask starts fresh; native replies to its recorded AI answers
            continue that branch. Other AI commands retain rolling memory.
            Thread lifetime follows memory_hours and retention_days.
        approval: *id001
        model: *id002
        profile_id: *id002
        allowed_conversations:
          type: array
          items: *id002
        generation:
          $ref: '#/components/schemas/Generation'
      required:
      - name
      - type
      - instructions
    Profile:
      type: object
      additionalProperties: false
      properties:
        id: *id002
        name: *id002
        model: *id002
        instructions: *id002
      required:
      - id
      - name
    Configuration:
      type: object
      additionalProperties: false
      properties:
        settings:
          $ref: '#/components/schemas/Settings'
        commands:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/Command'
        profiles:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/Profile'
      required:
      - settings
      - commands
      - profiles
    Model:
      type: object
      additionalProperties: false
      properties:
        id: *id002
        name: *id002
        provider: *id002
        remote_id: *id002
        context_length: *id003
        parameters:
          type: array
          items: *id002
        has_reasoning: *id001
        reasoning_mandatory: *id001
        reasoning_efforts:
          type:
          - array
          - 'null'
          items: *id002
        input_price: *id004
        output_price: *id004
        pricing_known: *id001
        input_modalities:
          type: array
          description: What the provider's catalog says the model reads, such as text, image, audio and video. Informational only: files are sent to a model whatever it lists, and the chat is told if the provider refuses one.
          items:
            type: string
    CompatibleProviderStatus:
      type: object
      additionalProperties: false
      properties:
        base_url: *id002
        configured: *id001
      required:
      - base_url
      - configured
    Attachment:
      type: object
      additionalProperties: false
      required: [id, name, mime, size]
      properties:
        id:
          type: string
        name:
          type: string
        mime:
          type: string
        size:
          type: integer
          minimum: 0
    AttachmentUpload:
      type: object
      additionalProperties: false
      required: [name, data]
      properties:
        name:
          type: string
        mime:
          type: string
        data:
          type: string
          format: byte
          contentEncoding: base64
          description: Nonempty file bytes; configured per-file and combined limits apply unless set to zero.
    Message:
      type: object
      additionalProperties: false
      properties:
        pending_action: {type: string, description: Unresolved reaction action ID retained across browser refresh}
        protocol: {type: string, enum: [RCS, SMS, MMS, unknown], description: Observed protocol for this message, independent of current conversation capability}
        quote:
          type: object
          properties:
            id: {type: string, description: Local target ID when available in this conversation}
            text: {type: string, description: Bounded local preview or unavailable-original placeholder}
            direction: {type: string, enum: [incoming, outgoing]}
            available: {type: boolean}
        reactions:
          type: array
          items:
            type: object
            properties:
              emoji: {type: string}
              count: {type: integer, minimum: 0}
              mine: {type: boolean}
              unsupported: {type: boolean, description: Image or undecoded reaction; display an accessible placeholder}
        revision: {type: integer, minimum: 0}
        id: *id002
        direction:
          type: string
          enum:
          - incoming
          - outgoing
        at:
          type: string
          format: date-time
        text: *id002
        attachments:
          type: array
          description: Present on owner full-inbox history only. File keys, remote locators and bytes are never included.
          items:
            $ref: '#/components/schemas/Attachment'
        origin:
          type: string
        status:
          type: string
        sender:
          type: string
          description: Participant ID of whoever sent an incoming message in a group; match it to the conversation's members. Absent for individual conversations.
    MessageActions:
      type: object
      required: [reply, react, edit, edit_reason, version]
      properties:
        reply: {type: boolean}
        react: {type: boolean}
        edit: {type: boolean}
        edit_reason: {type: string}
        reason: {type: string}
        version: {type: string}
        pending: {type: string, description: Unresolved reaction action ID, when present}
    InboxPage:
      type: object
      additionalProperties: false
      properties:
        messages:
          type: array
          items:
            $ref: '#/components/schemas/Message'
        change_cursor: {type: integer, minimum: 0}
        next_cursor: *id002
      required:
      - messages
      - next_cursor

    AttachmentLimits:
      type: object
      additionalProperties: false
      required: [max_files, max_file_mb, max_total_mb]
      description: Owner attachment limits. Zero means Unlimited independently. Missing limits use defaults 4 files, 10 MiB each, 20 MiB combined. These are application limits, not upstream/carrier guarantees.
      properties:
        max_files:
          type: integer
          minimum: 0
        max_file_mb:
          type: integer
          minimum: 0
        max_total_mb:
          type: integer
          minimum: 0
    OwnerInboxSettings:
      type: object
      additionalProperties: false
      required:
      - enabled
      - scope
      - conversations
      - load_older
      - automatic_replies
      - revision
      properties:
        archive_retention_days: {type: integer, minimum: 0, maximum: 3650, default: 0}
        attachment_limits:
          $ref: '#/components/schemas/AttachmentLimits'
        enabled:
          type: boolean
          default: false
        scope:
          type: string
          enum:
          - all
          - selected
        conversations:
          type: array
          maxItems: 500
          items:
            type: object
            additionalProperties: false
            required:
            - conversation
            - participant
            properties:
              conversation:
                type: string
              participant:
                type: string
        load_older:
          type: boolean
        groups:
          type: boolean
          default: false
          description: With scope all, also save group conversations. A group chosen by name under scope selected is saved whatever this says.
        mark_read_when_viewed:
          type: boolean
          default: true
          description: Mark a conversation read on the phone while the owner is viewing it. Omitted means on.
          default: false
