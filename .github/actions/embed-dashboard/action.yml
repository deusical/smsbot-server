name: Build and embed the dashboard
description: Installs frontend dependencies, builds the dashboard (no type-check; the build job does that) and copies it into the Go embed directory.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: npm
        cache-dependency-path: web/package-lock.json
    - shell: bash
      working-directory: web
      run: npm ci --no-audit --no-fund && npx vite build
    - shell: bash
      run: node scripts/sync-web-assets.mjs
