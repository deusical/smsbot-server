name: Offline checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        timeout-minutes: 5
        working-directory: web
      - name: Frontend unit tests
        run: npm run test:unit
        timeout-minutes: 3
        working-directory: web
      - name: Build dashboard
        run: npm run build
        timeout-minutes: 3
        working-directory: web
      - name: Audit production frontend dependencies
        run: npm audit --omit=dev
        timeout-minutes: 3
        working-directory: web
      - run: node --test scripts/sync-web-assets.test.mjs
      - run: node scripts/sync-web-assets.mjs
      - run: go build -trimpath -ldflags="-s -w -X main.version=ci-${GITHUB_SHA::7}" -o bin/smsbot ./cmd/smsbot
      - uses: actions/upload-artifact@v4
        with:
          name: fixture-build
          path: |
            bin/smsbot
            web/dist/
          retention-days: 1
          compression-level: 1
  backend:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: false
      # Rolling race-test cache: every run restores the newest one (pull requests
      # read main's) and only main pushes save, so cold runs are rare and the cache
      # does not go stale.
      - name: Restore Go build cache
        id: gocache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-race-1.27.3-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-race-1.27.3-${{ hashFiles('go.sum') }}-
            go-race-1.27.3-
      - uses: actions/download-artifact@v4
        with:
          name: fixture-build
      - run: cp -r web/dist/* internal/httpapi/assets/
      - name: Backend race tests
        run: go test -race -count=1 ./...
        timeout-minutes: 8
      - name: Go vet
        run: go vet ./...
        timeout-minutes: 3
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: Audit Go dependencies
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
        timeout-minutes: 5
        env:
          GOTOOLCHAIN: go1.27.3
      - name: Save Go build cache
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ steps.gocache.outputs.cache-primary-key }}
  browser:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Keep the image and compatibility check aligned with web/package-lock.json.
    # The digest pins the published multi-platform v1.64.0-noble image.
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble@sha256:06a9939e57531807f8d5fd76ce44b53165ffb7d7501d87ab10e285c20b1e971f
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: fixture-build
      - run: chmod +x bin/smsbot
      - name: Install browser test dependencies
        run: npm ci
        timeout-minutes: 5
        working-directory: web
      - name: Verify browser image and fixture compatibility
        run: |
          test "$(node -p 'require("./package-lock.json").packages["node_modules/@playwright/test"].version')" = "1.64.0"
          npx playwright --version
          ../bin/smsbot --version
        timeout-minutes: 1
        working-directory: web
      # One worker per fixture database. A single job pays container start-up once;
      # hosted runners bill each job in whole minutes.
      - name: Browser tests
        run: npm test
        timeout-minutes: 10
        working-directory: web
      - name: Preserve failed browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-${{ github.run_attempt }}
          path: web/test-results/
          retention-days: 7
          if-no-files-found: ignore
