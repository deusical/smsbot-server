name: Offline checks
# Pull requests only: branch protection requires these checks before merge, and
# main.yml reruns the Go suite after each merge (which also warms the cache).
#
# The repository is public, so hosted-runner minutes are free and only time to a
# result matters. The three jobs therefore start together and each builds what it
# needs (a few seconds) instead of waiting on an artifact from another job.
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  GO_VERSION: '1.27.3'
  GOTOOLCHAIN: go1.27.3
jobs:
  # Frontend checks, Go lint and audits, download worker fixtures.
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
        working-directory: web
      - name: Frontend unit tests
        run: npm run test:unit
        working-directory: web
      - name: Type-check and build dashboard
        run: npm run build
        working-directory: web
      - name: Audit production frontend dependencies
        run: npm audit --omit=dev
        working-directory: web
      - run: node --test scripts/sync-web-assets.test.mjs
      - name: Remote phone helper fixtures
        run: python3 -B -m unittest discover -s scripts -p test_pair_remote.py
      # The synthetic FFmpeg case skips here (no FFmpeg on the runner); run it locally.
      - name: Download worker fixtures
        run: |
          python3 -m pip install --quiet 'cryptography>=45,<47'
          python3 -B -m unittest discover -s scripts -p test_download_worker.py
      - uses: ./.github/actions/setup-go-cached
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: Go vet
        run: go vet ./...
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
      - name: Audit Go dependencies
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/embed-dashboard
      - uses: ./.github/actions/setup-go-cached
        with:
          go-version: ${{ env.GO_VERSION }}
      # No -count=1: packages whose code, dependencies and test inputs are unchanged
      # since main.yml last ran reuse its cached result. A few payload-heavy tests
      # skip under -race (internal/racetest); they run with a plain `go test ./...`.
      - name: Backend race tests
        run: go test -race ./...
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/embed-dashboard
      - uses: ./.github/actions/setup-go-cached
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go build -trimpath -o bin/smsbot ./cmd/smsbot
      # The runner image ships Google Chrome; using it skips a browser download or
      # container pull. Fall back to Playwright's Chromium if an image ever lacks it.
      - name: Choose browser
        run: |
          if command -v google-chrome >/dev/null; then
            google-chrome --version
            echo PW_CHANNEL=chrome >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
        working-directory: web
      # Four workers, each with its own fixture server (see web/playwright.config.ts).
      - name: Browser tests
        run: npm test
        timeout-minutes: 6
        working-directory: web
      - name: Preserve failed browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-${{ github.run_attempt }}
          path: web/test-results/
          retention-days: 7
          if-no-files-found: ignore
