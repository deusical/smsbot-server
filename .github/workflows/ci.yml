name: Offline checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci && npm run build
        working-directory: web
      - run: cp -r web/dist/* internal/httpapi/assets/
      - run: go test -race -count=1 ./... && go vet ./... && go build -trimpath -o bin/smsbot ./cmd/smsbot
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
        env:
          GOTOOLCHAIN: go1.27.2
      - run: npm audit --omit=dev
        working-directory: web
      - run: npx playwright install --with-deps chromium && npm test
        working-directory: web

      - name: Preserve failed browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-${{ github.event_name }}-${{ github.run_attempt }}
          path: web/test-results/
          retention-days: 7
          if-no-files-found: ignore
